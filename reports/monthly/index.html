<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly dashboard</title>
<!-- Proof of concept (phase 2, O5). Loads <YYYY-MM>.json written by `python -m reports.monthly`.
     fetch() is blocked on file:// pages, so serve this folder:
       python -m http.server 8000 -d reports/monthly   ->  http://localhost:8000/?month=2026-09 -->
<style>
/* Same tokens and components as reports/theme.py (this page is static, so they are copied here). */
:root { --canvas:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --faint:#86868B; --hair:#F0F0F2;
  --line:rgba(0,0,0,.06); --line-2:rgba(0,0,0,.1); --hover:#F8F9FA; --accent:#0054A4; --bad:#D70015;
  --shadow:0 4px 20px rgba(0,0,0,.03);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font:14px/1.45 var(--font); letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
h1, p { margin:0; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
th, .label, label { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
.topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,.72); border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }
.topbar > div { max-width:1200px; margin:0 auto; padding:0 24px; height:44px; display:flex; align-items:center; gap:10px; }
.topbar b { font-size:13px; font-weight:600; color:var(--accent); }
.topbar span { font-size:13px; color:var(--muted); }
main { max-width:1200px; margin:0 auto; padding:32px 24px 56px; }
header { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:flex-end; justify-content:space-between; margin-bottom:20px; }
h1 { font-size:28px; font-weight:700; line-height:1.15; letter-spacing:-0.025em; }
header p { margin-top:4px; color:var(--muted); font-size:13px; }
label { display:flex; align-items:center; gap:8px; }
select { font:600 14px var(--font); padding:6px 12px; border:1px solid var(--line-2); border-radius:10px; background:var(--card); color:var(--ink); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.kpis:empty { display:none; }
.kpi, .card, .banner { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.kpi { padding:16px 20px; }
.kpi .value { margin-top:6px; font-size:32px; font-weight:700; line-height:1.1; letter-spacing:-0.03em; }
.kpi .sub { margin-top:4px; font-size:13px; color:var(--muted); }
.banner { margin-top:12px; padding:12px 20px; font-size:13px; }
.banner::before { content:""; display:inline-block; width:8px; height:8px; margin-right:10px; border-radius:50%; background:var(--bad); vertical-align:1px; }
.card { overflow-x:auto; margin-top:12px; padding:4px 0; }
table { width:100%; border-collapse:collapse; min-width:820px; }
th, td { padding:10px 16px; text-align:right; border-bottom:1px solid var(--hair); white-space:nowrap; }
th { background:var(--card); position:sticky; top:0; }
th:first-child, td:first-child { text-align:left; padding-left:20px; }
th:last-child, td:last-child { padding-right:20px; }
tbody tr:hover td { background-color:var(--hover); }
td.nodata { color:var(--faint); }
tr.partial td:first-child::after { content:" *"; color:var(--bad); font-weight:700; }
tfoot td { font-weight:700; border-top:1px solid var(--line-2); border-bottom:0; }
.foot { margin-top:16px; font-size:12px; color:var(--muted); }
#error { display:none; }
@media print {
  @page { size:letter portrait; margin:0.4in; }
  html, body { background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { font-size:7.5pt; }
  .topbar { position:static; background:none; backdrop-filter:none; }
  .topbar > div { height:auto; padding:0 0 3pt; }
  main { padding:6pt 0 0; }
  h1 { font-size:14pt; }
  label, #scorecard { display:none; }
  .kpi, .card, .banner { box-shadow:none; border-color:#d2d2d7; border-radius:8px; }
  .kpi { padding:4pt 8pt; }
  .kpi .value { font-size:13pt; }
  table { min-width:0; }
  th, td { padding:1pt 5pt; }
  th { position:static; font-size:6pt; }
  .card { overflow:visible; }
}
</style>
</head>
<body>
<nav class="topbar" aria-label="Reports"><div><a class="brand" href="../index.html"><b>Goodwill Michiana</b><span>E-commerce reporting</span></a><span class="grow"></span><a class="tb-link" href="../map.html">Site map</a><a class="home-btn" href="../index.html"><span>Home</span></a></div></nav>
<main>
  <header>
    <div>
      <h1 id="title">Monthly dashboard</h1>
      <p id="subtitle">Daily revenue by marketplace</p>
      <p><a id="scorecard" href="../scorecard/index.html">COO scorecard for this month</a></p>
    </div>
    <label>Month <select id="month"></select></label>
  </header>

  <div id="error" class="banner"></div>
  <div class="kpis" id="kpis"></div>
  <div id="partial-note" class="banner" hidden></div>
  <div class="card"><table id="table"></table></div>
  <div class="foot" id="notes"></div>
</main>

<script>
const MARKETS = [["shopgoodwill", "ShopGoodwill"], ["amazon", "Amazon"], ["ebay", "eBay"], ["other", "Other"]];
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const int = new Intl.NumberFormat("en-US");
const money = (c) => (c == null ? "" : usd.format(c / 100));
const count = (n) => (n == null ? "" : int.format(n));

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === "class" ? (node.className = v) : node.setAttribute(k, v)));
  if (text != null) node.textContent = text;  // textContent only: data never becomes markup
  return node;
}

function row(cells, cls) {
  const tr = el("tr", cls ? { class: cls } : {});
  cells.forEach((c) => tr.append(typeof c === "string" ? el("td", {}, c) : c));
  return tr;
}

async function getJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function showError(msg) {
  const box = document.getElementById("error");
  box.textContent = msg;
  box.style.display = "block";
}

function renderKpis(data) {
  const t = data.totals.enterprise;
  const kpis = document.getElementById("kpis");
  kpis.replaceChildren();
  [
    ["Revenue", money(t.revenue_cents), "net of refunds"],
    ["Orders", count(t.orders), `${t.days_with_data} of ${data.days_expected} days reported`],
    ["Refunds", money(t.refunds_cents), "already subtracted from revenue"],
    ["Marketplace fees", money(t.fees_cents), "not deducted from revenue"],
  ].forEach(([label, value, sub]) => {
    const card = el("div", { class: "kpi" });
    card.append(el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "sub" }, sub));
    kpis.append(card);
  });
}

function renderTable(data) {
  const table = document.getElementById("table");
  table.replaceChildren();
  const head = el("tr");
  ["Date", ...MARKETS.map(([, label]) => label), "Total revenue", "Orders", "Refunds", "Fees"]
    .forEach((h) => head.append(el("th", {}, h)));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);

  const body = el("tbody");
  const dayLabel = (iso) => new Date(iso + "T12:00:00")
    .toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const rows = [...data.days, ...data.days_missing.map((iso) => ({ date: iso, missing: true }))]
    .sort((a, b) => a.date.localeCompare(b.date));
  rows.forEach((d) => {
    if (d.missing) {
      const td = el("td", { class: "nodata", colspan: MARKETS.length + 4 }, "No pulse for this day");
      body.append(row([dayLabel(d.date), td]));
      return;
    }
    const cells = [dayLabel(d.date)];
    MARKETS.forEach(([key]) => {
      const m = d.marketplaces[key];
      cells.push(m.status === "ok" ? money(m.revenue_cents)
        : el("td", { class: "nodata", title: m.status }, m.status === "not_configured" ? "n/a" : "No data"));
    });
    const e = d.enterprise;
    cells.push(money(e.revenue_cents), count(e.orders), money(e.refunds_cents), money(e.fees_cents));
    body.append(row(cells, e.complete ? "" : "partial"));
  });
  table.append(body);

  const t = data.totals;
  const foot = el("tfoot");
  foot.append(row(["Month", ...MARKETS.map(([k]) => (t[k].revenue_cents == null ? "-" : money(t[k].revenue_cents))),
    money(t.enterprise.revenue_cents), count(t.enterprise.orders), money(t.enterprise.refunds_cents),
    money(t.enterprise.fees_cents)]));
  table.append(foot);

  const partial = data.days.filter((d) => !d.enterprise.complete).length;
  const note = document.getElementById("partial-note");
  note.hidden = !partial;
  note.textContent = partial ? `* ${partial} day(s) are missing at least one marketplace file; their totals are partial.` : "";
}

async function load(month) {
  try {
    const data = await getJSON(`${month}.json`);
    const first = new Date(month + "-01T12:00:00");
    document.getElementById("title").textContent =
      "Monthly dashboard: " + first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    document.getElementById("subtitle").textContent =
      `Daily revenue by marketplace · generated ${data.generated_at}`;
    renderKpis(data);
    renderTable(data);
    document.getElementById("notes").textContent = data.notes.join(" ");
    document.getElementById("scorecard").href = `../scorecard/month-${month}.html`;
    history.replaceState(null, "", `?month=${month}`);
  } catch (err) {
    showError(`Could not load ${month}.json (${err.message}). Run: python -m reports.monthly --month ${month}`);
  }
}

async function init() {
  if (location.protocol === "file:") {
    showError("This page loads its data with fetch(), which browsers block for files opened from disk. " +
      "Serve it instead: python -m http.server 8000 -d reports/monthly, then open http://localhost:8000/");
    return;
  }
  let months = [];
  try {
    months = (await getJSON("months.json")).months;
  } catch (err) {
    showError("No months yet. Run: python -m reports.monthly --month YYYY-MM");
    return;
  }
  const select = document.getElementById("month");
  months.forEach((m) => select.append(el("option", { value: m }, m)));
  const wanted = new URLSearchParams(location.search).get("month");
  select.value = months.includes(wanted) ? wanted : months[months.length - 1];
  select.addEventListener("change", () => load(select.value));
  load(select.value);
}

init();
</script>
</body>
</html>
