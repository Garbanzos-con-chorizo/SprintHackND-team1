<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly dashboard</title>
<!-- Proof of concept (phase 2, O5). Loads <YYYY-MM>.json written by `python -m reports.monthly`.
     fetch() is blocked on file:// pages, so serve this folder:
       python -m http.server 8000 -d reports/monthly   ->  http://localhost:8000/?month=2026-09 -->
<style>
/* Same tokens and components as reports/theme.py (this page is static, so they are copied here). */
:root { --blue:#0054A4; --blue-tint:#EAF1F8; --ink:#231F20; --ink-2:#495057; --muted:#6C757D;
  --bg:#FFFFFF; --bg-1:#F8F9FA; --bg-2:#F1F3F5; --rule:#DEE2E6; --red:#D9381E;
  --bd:1px solid var(--rule); --bd-blue:2px solid var(--blue);
  --font:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
*, *::before, *::after { box-sizing:border-box; border-radius:0; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 var(--font); letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
h1, p { margin:0; }
a { color:var(--blue); text-decoration:none; }
a:hover { text-decoration:underline; }
code { font-size:.92em; }
th, .label, label { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.brandbar { background:var(--blue); color:#fff; }
.brandbar > div { max-width:1200px; margin:0 auto; padding:0 16px; height:28px; display:flex; align-items:center; gap:8px; }
.brandbar b { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; }
.brandbar span { font-size:11.5px; padding-left:8px; border-left:1px solid rgba(255,255,255,.45); }
main { max-width:1200px; margin:0 auto; padding:16px 16px 24px; }
header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:end; justify-content:space-between; padding-bottom:8px;
  border-bottom:var(--bd-blue); }
h1 { font-size:20px; font-weight:700; line-height:1.2; letter-spacing:-0.02em; }
header p { margin-top:2px; color:var(--muted); font-size:11.5px; }
label { display:flex; align-items:center; gap:8px; color:var(--muted); }
select { font:600 13px var(--font); padding:4px 8px; border:1px solid var(--blue); background:var(--bg); color:var(--ink); }
.kpis { display:flex; flex-wrap:wrap; gap:1px; margin:12px 0 0; background:var(--rule); border:var(--bd); }
.kpis:empty { display:none; }
.kpi { flex:1 1 170px; padding:8px 12px; background:var(--bg); }
.kpi .label { color:var(--blue); }
.kpi .value { margin-top:2px; font-size:22px; font-weight:700; line-height:1.15; letter-spacing:-0.02em; }
.kpi .sub { margin-top:2px; font-size:11.5px; color:var(--ink-2); }
.banner { margin:12px 0 0; padding:6px 12px; background:var(--bg); border:var(--bd); border-left:3px solid var(--red); }
.card { overflow-x:auto; margin-top:12px; }
table { width:100%; border-collapse:collapse; min-width:820px; }
th, td { padding:5px 8px; text-align:right; border-bottom:var(--bd); white-space:nowrap; }
th { color:var(--blue); background:var(--bg); border-bottom:var(--bd-blue); position:sticky; top:0; }
th:first-child, td:first-child { text-align:left; }
tbody tr:nth-child(even) td { background-color:var(--bg-1); }
tbody tr:hover td { background-color:var(--blue-tint); }
td.nodata { color:var(--muted); font-style:italic; }
tr.partial td:first-child::after { content:" *"; color:var(--red); font-weight:700; }
tfoot td { font-weight:700; border-top:1px solid var(--ink); border-bottom:3px double var(--ink); }
.foot { margin-top:16px; padding-top:8px; border-top:var(--bd); font-size:11.5px; color:var(--ink-2); }
#error { display:none; }
@media print {
  @page { size:letter portrait; margin:0.4in; }
  html, body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { font-size:7.5pt; }
  label, #scorecard { display:none; }
  table { min-width:0; }
  th, td { padding:1pt 4pt; }
  th { position:static; font-size:6pt; }
  .kpi .value { font-size:13pt; }
  .card { overflow:visible; }
}
</style>
</head>
<body>
<div class="brandbar"><div><b>Goodwill Michiana</b><span>E-commerce reporting</span></div></div>
<main>
  <header>
    <div>
      <h1 id="title">Monthly dashboard</h1>
      <p id="subtitle">Daily revenue by marketplace</p>
      <p><a id="scorecard" href="#">COO scorecard for this month</a></p>
    </div>
    <label>Month <select id="month"></select></label>
  </header>

  <div id="error" class="banner"></div>
  <div class="kpis" id="kpis"></div>
  <div id="partial-note" class="banner" hidden></div>
  <div class="card"><table id="table"></table></div>
  <div class="foot" id="notes"></div>
</main>

<script>
const MARKETS = [["shopgoodwill", "ShopGoodwill"], ["amazon", "Amazon"], ["ebay", "eBay"], ["other", "Other"]];
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const int = new Intl.NumberFormat("en-US");
const money = (c) => (c == null ? "" : usd.format(c / 100));
const count = (n) => (n == null ? "" : int.format(n));

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === "class" ? (node.className = v) : node.setAttribute(k, v)));
  if (text != null) node.textContent = text;  // textContent only: data never becomes markup
  return node;
}

function row(cells, cls) {
  const tr = el("tr", cls ? { class: cls } : {});
  cells.forEach((c) => tr.append(typeof c === "string" ? el("td", {}, c) : c));
  return tr;
}

async function getJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function showError(msg) {
  const box = document.getElementById("error");
  box.textContent = msg;
  box.style.display = "block";
}

function renderKpis(data) {
  const t = data.totals.enterprise;
  const kpis = document.getElementById("kpis");
  kpis.replaceChildren();
  [
    ["Revenue", money(t.revenue_cents), "net of refunds"],
    ["Orders", count(t.orders), `${t.days_with_data} of ${data.days_expected} days reported`],
    ["Refunds", money(t.refunds_cents), "already subtracted from revenue"],
    ["Marketplace fees", money(t.fees_cents), "not deducted from revenue"],
  ].forEach(([label, value, sub]) => {
    const card = el("div", { class: "kpi" });
    card.append(el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "sub" }, sub));
    kpis.append(card);
  });
}

function renderTable(data) {
  const table = document.getElementById("table");
  table.replaceChildren();
  const head = el("tr");
  ["Date", ...MARKETS.map(([, label]) => label), "Total revenue", "Orders", "Refunds", "Fees"]
    .forEach((h) => head.append(el("th", {}, h)));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);

  const body = el("tbody");
  const dayLabel = (iso) => new Date(iso + "T12:00:00")
    .toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const rows = [...data.days, ...data.days_missing.map((iso) => ({ date: iso, missing: true }))]
    .sort((a, b) => a.date.localeCompare(b.date));
  rows.forEach((d) => {
    if (d.missing) {
      const td = el("td", { class: "nodata", colspan: MARKETS.length + 4 }, "No pulse for this day");
      body.append(row([dayLabel(d.date), td]));
      return;
    }
    const cells = [dayLabel(d.date)];
    MARKETS.forEach(([key]) => {
      const m = d.marketplaces[key];
      cells.push(m.status === "ok" ? money(m.revenue_cents)
        : el("td", { class: "nodata", title: m.status }, m.status === "not_configured" ? "n/a" : "No data"));
    });
    const e = d.enterprise;
    cells.push(money(e.revenue_cents), count(e.orders), money(e.refunds_cents), money(e.fees_cents));
    body.append(row(cells, e.complete ? "" : "partial"));
  });
  table.append(body);

  const t = data.totals;
  const foot = el("tfoot");
  foot.append(row(["Month", ...MARKETS.map(([k]) => (t[k].revenue_cents == null ? "-" : money(t[k].revenue_cents))),
    money(t.enterprise.revenue_cents), count(t.enterprise.orders), money(t.enterprise.refunds_cents),
    money(t.enterprise.fees_cents)]));
  table.append(foot);

  const partial = data.days.filter((d) => !d.enterprise.complete).length;
  const note = document.getElementById("partial-note");
  note.hidden = !partial;
  note.textContent = partial ? `* ${partial} day(s) are missing at least one marketplace file; their totals are partial.` : "";
}

async function load(month) {
  try {
    const data = await getJSON(`${month}.json`);
    const first = new Date(month + "-01T12:00:00");
    document.getElementById("title").textContent =
      "Monthly dashboard: " + first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    document.getElementById("subtitle").textContent =
      `Daily revenue by marketplace · generated ${data.generated_at}`;
    renderKpis(data);
    renderTable(data);
    document.getElementById("notes").textContent = data.notes.join(" ");
    document.getElementById("scorecard").href = `../scorecard/month-${month}.html`;
    history.replaceState(null, "", `?month=${month}`);
  } catch (err) {
    showError(`Could not load ${month}.json (${err.message}). Run: python -m reports.monthly --month ${month}`);
  }
}

async function init() {
  if (location.protocol === "file:") {
    showError("This page loads its data with fetch(), which browsers block for files opened from disk. " +
      "Serve it instead: python -m http.server 8000 -d reports/monthly, then open http://localhost:8000/");
    return;
  }
  let months = [];
  try {
    months = (await getJSON("months.json")).months;
  } catch (err) {
    showError("No months yet. Run: python -m reports.monthly --month YYYY-MM");
    return;
  }
  const select = document.getElementById("month");
  months.forEach((m) => select.append(el("option", { value: m }, m)));
  const wanted = new URLSearchParams(location.search).get("month");
  select.value = months.includes(wanted) ? wanted : months[months.length - 1];
  select.addEventListener("change", () => load(select.value));
  load(select.value);
}

init();
</script>
</body>
</html>
